    <circle cx="160" cy="666" r="15"/><circle cx="558" cy="650" r="15"/><circle cx="990" cy="416" r="15"/>
  </g>
  <g transform="rotate(-7 600 430)" filter="url(#shadow)">
    <rect x="260" y="185" width="680" height="485" rx="18" fill="url(#paper)" stroke="#6c5433" stroke-width="10"/>
    <path d="M270 205l330 280 330-280" fill="#e8dab2" stroke="#836c43" stroke-width="8"/>
    <path d="M275 650l258-232m394 232L669 418" fill="none" stroke="#9f885e" stroke-width="6"/>
    <circle cx="600" cy="485" r="74" fill="#7d2634" stroke="#45131c" stroke-width="10"/>
    <path d="M600 433l18 36 40 6-29 28 7 40-36-19-36 19 7-40-29-28 40-6z" fill="#d7b357"/>
    <path d="M380 565c120 18 320 18 440 0M415 610c98 12 272 12 370 0" fill="none" stroke="#67583c" stroke-width="7" opacity=".55"/>
  </g>
