<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">The century-wet letter</title>
  <desc id="description">A weathered sealed letter rests on Mira Thorn's burgundy route map.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7edce"/>
      <stop offset="1" stop-color="#cdb98a"/>
    </linearGradient>
    <radialGradient id="table" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#56333c"/>
      <stop offset="1" stop-color="#171820"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#09090d" flood-opacity=".65"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#table)"/>
  <g fill="none" stroke="#c8a34b" stroke-width="6" opacity=".55">
    <path d="M40 710C260 580 330 790 560 650s340-110 600-320"/>
    <path d="M70 790c240-120 370 40 560-90s290-160 500-220" stroke-dasharray="18 24"/>
