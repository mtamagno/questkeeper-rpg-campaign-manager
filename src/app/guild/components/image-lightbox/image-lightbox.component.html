<!-- Image Lightbox — Fullscreen overlay with navigation -->
<div
  #lightboxDialog
  class="lightbox"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown.escape)="lightboxClose.emit()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="isItalian() ? 'Visualizzatore immagini' : 'Image viewer'"
>
  <!-- Close button -->
  <button
    #closeButton
    class="lightbox__close"
    type="button"
    (click)="lightboxClose.emit()"
    [attr.aria-label]="isItalian() ? 'Chiudi immagine' : 'Close lightbox'"
  >
    ✕
  </button>

  @if (currentImage(); as image) {
    <!-- Main image -->
    <div class="lightbox__content">
      <img
        class="lightbox__image"
        [src]="image.url"
        [alt]="image.alt"
        (load)="$event.target.classList.add('is-loaded')"
        loading="eager"
        decoding="async"
      />

      @if (image.caption) {
        <p class="lightbox__caption">{{ image.caption }}</p>
      }
    </div>
  }

  <!-- Navigation -->
  @if (images().length > 1) {
    <button
      class="lightbox__nav lightbox__nav--prev"
      type="button"
      [disabled]="!hasPrevious()"
      (click)="goToPrevious(); $event.stopPropagation()"
      [attr.aria-label]="isItalian() ? 'Immagine precedente' : 'Previous image'"
    >
      ‹
    </button>

    <button
      class="lightbox__nav lightbox__nav--next"
      type="button"
      [disabled]="!hasNext()"
      (click)="goToNext(); $event.stopPropagation()"
      [attr.aria-label]="isItalian() ? 'Immagine successiva' : 'Next image'"
    >
      ›
    </button>

    <!-- Position indicator -->
    <span class="lightbox__position">{{ positionLabel() }}</span>
  }
</div>
