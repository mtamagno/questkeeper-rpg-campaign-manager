<!-- Password Dialog — Fantasy themed unlock overlay -->
<div
  #dialogPanel
  class="password-backdrop"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
  role="dialog"
  aria-modal="true"
  aria-labelledby="password-dialog-title"
  aria-describedby="password-dialog-description"
>
  <div class="password-dialog qk-panel qk-panel--raised qk-panel--accent">
    <!-- Header -->
    <div class="password-dialog__header">
      <span class="password-dialog__icon">🔒</span>
      <h2 id="password-dialog-title" class="password-dialog__title">Protected Section</h2>
      <p id="password-dialog-description" class="password-dialog__subtitle">
        Enter the password for {{ characterName() }}
      </p>
    </div>

    <!-- Form -->
    <form class="password-dialog__form" (submit)="$event.preventDefault(); onSubmit()">
      <div class="password-dialog__field">
        <label class="password-dialog__label" for="password-input">Password</label>
        <div class="password-dialog__input-wrapper">
          <input
            #passwordInput
            id="password-input"
            class="password-dialog__input"
            [type]="isPasswordVisible() ? 'text' : 'password'"
            [value]="passwordValue()"
            (input)="onPasswordInput($event)"
            placeholder="Speak, friend, and enter..."
            autocomplete="current-password"
            [attr.aria-invalid]="hasError()"
            [attr.aria-describedby]="hasError() ? 'password-dialog-error' : null"
          />
          <button
            type="button"
            class="password-dialog__toggle"
            (click)="toggleVisibility()"
            [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
          >
            {{ isPasswordVisible() ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>

        @if (hasError()) {
          <p id="password-dialog-error" class="password-dialog__error" role="alert">
            Wrong password. The lock remains sealed.
          </p>
        }
      </div>

      <div class="password-dialog__actions">
        <button
          type="button"
          class="password-dialog__btn qk-button qk-button--secondary"
          (click)="dialogClose.emit()"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="password-dialog__btn qk-button qk-button--primary"
          [disabled]="passwordValue().trim().length === 0"
        >
          Unlock
        </button>
      </div>
    </form>
  </div>
</div>
