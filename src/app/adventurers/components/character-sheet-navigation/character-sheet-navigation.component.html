<nav
  class="sheet-navigation"
  [attr.aria-label]="isItalian() ? 'Viste della scheda' : 'Sheet views'"
>
  <div class="sheet-navigation__tabs" role="tablist" aria-orientation="horizontal">
    @for (workspace of workspaces(); track workspace.id) {
      <button
        class="sheet-navigation__tab"
        type="button"
        role="tab"
        [id]="tabId(workspace.id)"
        [attr.aria-controls]="panelId(workspace.id)"
        [attr.aria-selected]="activeSection() === workspace.id"
        [attr.tabindex]="activeSection() === workspace.id ? 0 : -1"
        [class.sheet-navigation__tab--active]="activeSection() === workspace.id"
        (click)="select(workspace.id)"
        (keydown)="onKeydown($event, workspace.id)"
      >
        <span class="sheet-navigation__icon" aria-hidden="true">{{ workspace.icon }}</span>
        <span class="sheet-navigation__label">{{ workspace.label }}</span>
        @if (workspace.count !== undefined) {
          <span class="sheet-navigation__count" aria-hidden="true">{{ workspace.count }}</span>
        }
      </button>
    }
  </div>

  <p class="sheet-navigation__description" aria-live="polite">{{ activeDescription() }}</p>

  @if (selectedLevel() !== currentLevel()) {
    <div class="sheet-navigation__archive" role="status">
      <span>
        {{
          isItalian()
            ? 'Stai consultando una scheda archiviata di livello ' + selectedLevel() + '.'
            : 'You are viewing an archived level ' + selectedLevel() + ' sheet.'
        }}
      </span>
      <button type="button" (click)="currentRequested.emit()">
        {{ isItalian() ? 'Torna al livello attuale' : 'Return to current level' }}
      </button>
    </div>
  }
</nav>
