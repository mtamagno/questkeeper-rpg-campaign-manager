<!-- Main Application Layout — Sidebar + Content -->
<a class="skip-link" href="#main-content">
  {{ uiText.text('app.skipToMain') }}
</a>

<div
  class="app-layout"
  [class.app-layout--nav-open]="isSidebarOpen()"
  [attr.data-qk-palette]="activePalette()"
  [style]="activePaletteStyles()"
>
  <!-- Mobile hamburger toggle -->
  <button
    #menuToggle
    class="app-layout__hamburger"
    type="button"
    (click)="toggleSidebar()"
    aria-controls="app-sidebar"
    [attr.aria-expanded]="isSidebarOpen()"
    [attr.aria-label]="uiText.text('app.toggleNavigation')"
  >
    ☰
  </button>

  <!-- Sidebar navigation -->
  <app-sidebar id="app-sidebar" [isOpen]="isSidebarOpen()" (sidebarClose)="closeSidebar()" />

  <!-- Mobile backdrop overlay -->
  @if (isSidebarOpen()) {
    <div class="app-layout__backdrop" (click)="closeSidebar(true)" aria-hidden="true"></div>
  }

  <!-- Main content area -->
  <main
    id="main-content"
    class="app-layout__content"
    tabindex="-1"
    [attr.aria-label]="uiText.text('app.campaignContent')"
  >
    <app-site-command-bar />
    <div class="app-layout__route-wrapper">
      <router-outlet />
    </div>
  </main>
</div>

<p class="route-announcer" aria-live="polite" aria-atomic="true">
  {{ routeAnnouncement() }}
</p>

<app-guided-tour />
