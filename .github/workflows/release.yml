name: Publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION."
            exit 1
          }
          test -f "docs/releases/$RELEASE_TAG.md" || {
            echo "Missing docs/releases/$RELEASE_TAG.md release notes."
            exit 1
          }
      - run: npm ci
      - name: Install transcriber test dependencies
        run: python -m pip install -r discord-transcriber/requirements-test.txt
      - name: Run release quality gates
        run: npm run verify

  build-native-packages:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            archive: zip
          - os: ubuntu-latest
            artifact: linux-x64
            archive: tar
          - os: macos-15-intel
            artifact: macos-intel
            archive: tar
          - os: macos-15
            artifact: macos-apple-silicon
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build and smoke-test standalone setup
        run: npm run build:setup
      - name: Package QuestKeeper with its native setup
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
          ARCHIVE_KIND: ${{ matrix.archive }}
        run: |
          $folderName = "questkeeper-$env:RELEASE_TAG"
          $packageRoot = Join-Path $PWD "release-package"
          $stage = Join-Path $packageRoot $folderName
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          git archive --format=tar --output=source.tar $env:GITHUB_SHA
          tar -xf source.tar -C $stage
          if ($env:RUNNER_OS -eq 'Windows') {
            Copy-Item dist/setup/QuestKeeper-Setup.exe $stage
          } elseif ($env:RUNNER_OS -eq 'macOS') {
            $app = Join-Path $stage 'QuestKeeper Setup.app/Contents'
            New-Item -ItemType Directory -Path (Join-Path $app 'MacOS') -Force | Out-Null
            Copy-Item dist/setup/questkeeper-setup (Join-Path $app 'MacOS/questkeeper-setup')
            Copy-Item tools/setup-wizard/macos/Info.plist (Join-Path $app 'Info.plist')
            chmod +x (Join-Path $app 'MacOS/questkeeper-setup')
          } else {
            Copy-Item dist/setup/questkeeper-setup $stage
            chmod +x (Join-Path $stage 'questkeeper-setup')
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          if ($env:ARCHIVE_KIND -eq 'zip') {
            Compress-Archive -Path $stage -DestinationPath "artifacts/questkeeper-$env:RELEASE_TAG-$env:ARTIFACT_NAME.zip" -CompressionLevel Optimal
          } else {
            tar -czf "artifacts/questkeeper-$env:RELEASE_TAG-$env:ARTIFACT_NAME.tar.gz" -C $packageRoot $folderName
          }
      - uses: actions/upload-artifact@v7
        with:
          name: questkeeper-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build-native-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: questkeeper-*
          path: artifacts
          merge-multiple: true
      - name: Create release checksums
        run: |
          cd artifacts
          sha256sum questkeeper-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/questkeeper-* \
            artifacts/SHA256SUMS.txt \
            --verify-tag \
            --title "QuestKeeper ${RELEASE_TAG#v}" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
