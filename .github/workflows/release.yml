name: Publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION."
            exit 1
          }
          test -f "docs/releases/$RELEASE_TAG.md" || {
            echo "Missing docs/releases/$RELEASE_TAG.md release notes."
            exit 1
          }
      - run: npm ci
      - name: Install transcriber test dependencies
        run: python -m pip install -r discord-transcriber/requirements-test.txt
      - name: Run release quality gates
        run: npm run verify
      - name: Build downloadable archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir artifacts
          PREFIX="questkeeper-$RELEASE_TAG/"
          git archive --format=zip --prefix="$PREFIX" --output="artifacts/questkeeper-$RELEASE_TAG.zip" "$GITHUB_SHA"
          git archive --format=tar --prefix="$PREFIX" "$GITHUB_SHA" | gzip -9 > "artifacts/questkeeper-$RELEASE_TAG.tar.gz"
          cd artifacts
          sha256sum questkeeper-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/questkeeper-"$RELEASE_TAG".zip \
            artifacts/questkeeper-"$RELEASE_TAG".tar.gz \
            artifacts/SHA256SUMS.txt \
            --verify-tag \
            --title "QuestKeeper ${RELEASE_TAG#v}" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
